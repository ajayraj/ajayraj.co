# cs-anki.ajayraj.co — Atomic Cards tool
# Drop this file in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Then: sudo certbot --nginx -d cs-anki.ajayraj.co

server {
    listen 80;
    server_name cs-anki.ajayraj.co;

    # Redirect HTTP → HTTPS (certbot will manage this block after cert issuance)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cs-anki.ajayraj.co;

    # Update this path to wherever you deploy the Vite build output
    root /var/www/cs-anki/dist;
    index index.html;

    # SPA fallback — all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSL certs (certbot fills these in)
    # ssl_certificate     /etc/letsencrypt/live/cs-anki.ajayraj.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cs-anki.ajayraj.co/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
